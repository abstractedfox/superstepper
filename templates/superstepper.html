<html>
<head>
    <script type="module">
        //TODO: put all the event handler imports in the same file
        import { start, setCurrentSession, clickHandler, updateInspectorTarget } from "../static/main.js";
        import { playing, uploadAudio, startAudio, stopAudio } from "../static/audio.js";
        import { uploadChart } from "../static/chart.js";
        import { scrollHandler } from "../static/graphics.js";

        document.querySelector("#button_play").addEventListener("click", (event) => { startAudio(document.querySelector("#startTime").value)});
        document.querySelector("#button_stop").addEventListener("click", (event) => { stopAudio() });

        document.querySelector("#audio_upload").addEventListener("change", uploadAudio);
        document.querySelector("#chart_upload").addEventListener("change", uploadChart);

        document.querySelector("#start_tick").addEventListener("input", () =>{ 
            updateInspectorTarget("start_tick", parseInt(document.querySelector("#start_tick").value));
        });
        document.querySelector("#end_tick").addEventListener("input", () =>{ 
            updateInspectorTarget("end_tick", parseInt(document.querySelector("#end_tick").value));
        });
        document.querySelector("#left_pos").addEventListener("input", () =>{ 
            updateInspectorTarget("left_pos", parseInt(document.querySelector("#left_pos").value));
        });
        document.querySelector("#right_pos").addEventListener("input", () =>{ 
            updateInspectorTarget("right_pos", parseInt(document.querySelector("#right_pos").value));
        });
        document.querySelector("#kind").addEventListener("input", () =>{ 
            updateInspectorTarget("kind", parseInt(document.querySelector("#kind").value));
        });
        document.querySelector("#player_id").addEventListener("input", () =>{ 
            updateInspectorTarget("player_id", parseInt(document.querySelector("#player_id").value));
        });

        document.querySelector("#lane").addEventListener("mousedown", (event) =>{ 
            clickHandler(event, parseInt(document.querySelector("#current_tick").value), parseFloat(document.querySelector("#tick_height").value));
        });
        
        document.querySelector("#lane").addEventListener("mouseup", (event) =>{ 
        });
        
        document.querySelector("#lane").addEventListener("mousemove", (event) =>{ 
            //note that you probably want event.offsetX, event.offsetY when relevant
        });
        
        document.querySelector("#lane").addEventListener("wheel", (event) =>{ 
            scrollHandler(event);
        });

        document.querySelector("#sessionDropdown").onchange = () => { setCurrentSession(null); };

        start(document.querySelector("#lane").getContext("2d"));
    </script>

    <style type="text/css">
        body{
            margin: 0px;
        }
        #container{
            display:flex;
        }
        
        #inspector-note{
            display: none; 
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="lane_area">
            <canvas id="lane" width="640" height = "480"></canvas>
        </div>
        <div id="controls">
            <form id="upload">
                <div>Audio Upload</div>
                <input type="file" value="Select Audio" id="audio_upload" />

                <div>Load Chart</div>
                <input type="file" value="Load Chart" id="chart_upload" />
            </form>
            
            <input type="button" value="Play" id="button_play"/>
            <input type="button" value="Stop" id="button_stop"/>
            
            <div>
                <input type="number" value="0" id="startTime" /> 
                Start From Beat
            </div>
            <div>
                <input type="number" value="120" id="bpmInput" /> 
                BPM
            </div>
            <div>
                <input type="number" value="0" id="current_tick" />
                今Tick
            </div>
            <div>
                <input type="number" value="0.1" id="tick_height" />
                Tick height (zoom)
            </div>
            <hr>
            <div>
                <input type="number" value="0" id="boopfreq" /> 
                Boop frequency 
            </div>
            
            <div>
                <input type="number" value="5730" id="port" /> 
                API Port
            </div>
            <div>
                <select id="sessionDropdown">
                </select>
                Chart session
            </div>
        </div>
        <div id="inspector-outer">
            <div>
                Inspector
            </div>
            <div id="inspector-note">
                <div id="selectedNote">
                </div>
                <div>
                    <input type="number" value="0" id="start_tick" />
                    Start Tick
                </div>
                <div>
                    <input type="number" value="0" id="end_tick" disabled />
                    End Tick
                </div>
                    
                <div>
                    <input type="number" value="0" id="left_pos" />
                    Left Position
                </div>
                    
                <div>
                    <input type="number" value="0" id="right_pos" />
                    Right Position
                </div>
                    
                <div>
                    <input type="number" value="0" id="kind" />
                    Kind
                </div>

                <div>
                    <input type="number" value="0" id="player_id" />
                    Player ID
                </div>
            </div>
        </div>
    </div>
</body>
</html>
